# fuzzel — launcher / dmenu
[main]
include=@RDOT_HOME@/.config/fuzzel/colors.ini
font=JetBrainsMono Nerd Font Mono:size=12
dpi-aware=no
prompt="  "
icon-theme=Papirus-Dark
icons-enabled=yes
terminal=kitty
layer=overlay
width=40
lines=10
horizontal-pad=24
vertical-pad=18
inner-pad=10
line-height=26
fields=filename,name,generic,keywords

[border]
width=1
radius=0

[dmenu]
exit-immediately-if-empty=yes
