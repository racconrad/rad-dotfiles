# The secondary panel inherits your normal Kitty theme and shell.
include kitty.conf
hide_window_decorations no
window_padding_width 16
tab_bar_style hidden
allow_remote_control socket-only
confirm_os_window_close 0
map ctrl+escape launch --type=background "@RDOT_HOME@/.local/bin/raccon-term" hide
map ctrl+shift+q launch --type=background "@RDOT_HOME@/.local/bin/raccon-term" close
