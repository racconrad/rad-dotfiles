[main]
style=@RDOT_HOME@/.config/gtklock/style.css
time-format=%H:%M
date-format=%A, %d %B
idle-hide=true
idle-timeout=30

[powerbar]
show-labels=false
linked-buttons=false
reboot-command=systemctl reboot
poweroff-command=systemctl poweroff
suspend-command=systemctl suspend
logout-command=
userswitch-command=

[userinfo]
under-clock=true
