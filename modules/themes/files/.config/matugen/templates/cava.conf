## Generated by matugen from {{image}} — edit ~/.config/matugen/templates/cava.conf.

[general]
framerate = 60
autosens = 1
bars = 0
bar_width = 1
bar_spacing = 1
sleep_timer = 5

[input]
method = pipewire
source = auto

[output]
method = noncurses
channels = stereo
mono_option = average

[color]
gradient = 1
gradient_count = 4
gradient_color_1 = '{{colors.primary.default.hex}}'
gradient_color_2 = '{{colors.on_primary_container.default.hex}}'
gradient_color_3 = '{{colors.on_tertiary_container.default.hex}}'
gradient_color_4 = '{{colors.tertiary.default.hex}}'

[smoothing]
monstercat = 1
waves = 0
noise_reduction = 77
