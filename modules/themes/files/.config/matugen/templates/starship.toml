# Generated by matugen from {{image}} — edit ~/.config/matugen/templates/starship.toml.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "matugen"

format = """
[](fg:primary_container)\
$directory\
[](fg:primary_container bg:surface_high)\
$git_branch\
$git_status\
[](fg:surface_high)\
$fill\
$cmd_duration\
$line_break\
$character"""

[palettes.matugen]
primary = "{{colors.primary.default.hex}}"
on_primary = "{{colors.on_primary.default.hex}}"
primary_container = "{{colors.primary_container.default.hex}}"
on_primary_container = "{{colors.on_primary_container.default.hex}}"
secondary = "{{colors.secondary.default.hex}}"
tertiary = "{{colors.tertiary.default.hex}}"
error = "{{colors.error.default.hex}}"
surface_high = "{{colors.surface_container_high.default.hex}}"
on_surface = "{{colors.on_surface.default.hex}}"
muted = "{{colors.on_surface_variant.default.hex}}"
outline = "{{colors.outline.default.hex}}"

[directory]
format = "[ $path ]($style)[$read_only]($read_only_style)"
style = "bold fg:on_primary_container bg:primary_container"
read_only = " 󰌾"
read_only_style = "bold fg:on_primary_container bg:primary_container"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
format = "[ $symbol$branch ]($style)"
symbol = " "
style = "bold fg:tertiary bg:surface_high"

[git_status]
format = "[($all_status$ahead_behind )]($style)"
style = "bold fg:secondary bg:surface_high"

[fill]
symbol = " "
style = "fg:on_surface"

[cmd_duration]
min_time = 2000
format = "[󱎫 $duration]($style)"
style = "bold fg:secondary"

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:tertiary)"
