# matugen configuration — Material You palette from the current wallpaper.
# Run via ~/.local/bin/wallpaper-set (matugen image <file> -m dark).

[config]

[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-3.0/colors.css'
post_hook = '(theme=$(gsettings get org.gnome.desktop.interface gtk-theme 2>/dev/null | tr -d "\047"); if [ -n "$theme" ] && [ "$theme" != Adwaita ]; then gsettings set org.gnome.desktop.interface gtk-theme Adwaita && sleep 0.2; gsettings set org.gnome.desktop.interface gtk-theme "$theme"; fi) >/dev/null 2>&1 &'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.css'
output_path = '~/.config/gtk-4.0/colors.css'

[templates.qt5ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'

[templates.qt6ct]
input_path = '~/.config/matugen/templates/qtct-colors.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'

[templates.fastfetch]
input_path = '~/.config/matugen/templates/fastfetch.jsonc'
output_path = '~/.config/fastfetch/config.jsonc'


