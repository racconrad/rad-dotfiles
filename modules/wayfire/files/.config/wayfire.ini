# ─────────────────────────────────────────────────────────────────────────────
#  Wayfire 0.11 configuration — clean Material You desktop
#  Keys listed under "themed" comments are rewritten by
#  ~/.local/bin/wayfire-theme-apply from the matugen palette.
#  Wayfire reloads this file automatically on change.
# ─────────────────────────────────────────────────────────────────────────────

[core]
plugins = alpha animate autostart blur command expo fast-switcher focus-change foreign-toplevel grid gtk-shell idle ipc ipc-rules move pixdecor place resize scale session-lock simple-tile vswitch wayfire-shell window-rules wm-actions wobbly xdg-activation cube switcher vswipe scale-title-filter wsets winshadows
# Give clients time to render geometry changes before using a scaled buffer.
transaction_timeout = 250

# 3x3 tiled grid; workspace 10 uses the separate floating workspace set.
vwidth = 3
vheight = 3

# Server-side decorations so pixdecor can draw rounded borders.
preferred_decoration_mode = server
xwayland = true

close_top_view = <super> KEY_Q
exit = <super> KEY_DELETE
focus_button_with_modifiers = false
focus_buttons = BTN_LEFT | BTN_MIDDLE | BTN_RIGHT
focus_buttons_passthrough = true

# themed: surface
background_color = \#191114ff

# ── Input ────────────────────────────────────────────────────────────────────

[input]
xkb_layout = us
xkb_variant = altgr-intl
kb_numlock_default_state = true
kb_capslock_default_state = false
kb_repeat_delay = 300
kb_repeat_rate = 40
cursor_theme = Bibata-Modern-Ice
cursor_size = 20
natural_scroll = false
mouse_accel_profile = flat
tap_to_click = true
disable_touchpad_while_typing = true

# ── Outputs (per-output overrides managed by ~/.local/bin/display-mode, see end of file) ──
[output]
mode = auto
position = auto
scale = 1.000000
transform = normal

# ── Decorations: thin rounded borders, no titlebar, soft rounded shadows ────
[pixdecor]
titlebar = false
border_size = 1
maximized_borders = false
maximized_shadows = false
overlay_engine = rounded_corners
rounded_corner_radius = 0
shadow_radius = 0
shadow_color = \#00000080
inactive_shadow_color = \#00000026
effect_type = smoke
animate = true
ignore_views = none
always_decorate = app_id is "kitty"
title_font = JetBrainsMono Nerd Font Mono 10
# themed: active border = primary, inactive border = outline_variant
fg_color = \#ffb0cbff
bg_color = \#514347ff
fg_text_color = \#541d35ff
bg_text_color = \#d5c2c6ff

# ── Tiling (dwindle-like) ────────────────────────────────────────────────────
effect_color = \#ffb0cb99
button_layout = :minimize,maximize,close
title_text_align = 1
[simple-tile]
tile_by_default = !(app_id is "waypaper" | app_id is "pavucontrol" | app_id is "org.pulseaudio.pavucontrol" | app_id is "nm-connection-editor" | app_id is "swappy" | title is "Picture-in-Picture" | title is "Picture in picture")
keep_fullscreen_on_adjacent = true
inner_gap_size = 10
outer_horiz_gap_size = 20
outer_vert_gap_size = 20
# Apply real client geometry directly; avoid stale crossfade snapshots while tiling.
animation_duration = 0
button_move = <super> BTN_LEFT
button_resize = <super> BTN_RIGHT
key_toggle = disabled
key_toggle_maximized = disabled
key_focus_left = disabled
key_focus_right = disabled
key_focus_above = disabled
key_focus_below = disabled
preview_border_width = 2
# themed: primary
preview_base_color = \#ffb0cb33
preview_base_border = \#ffb0cbcc

[move]
activate = <super> BTN_LEFT
enable_snap = true
snap_threshold = 10
join_views = false
preview_border_width = 2
# themed: primary
preview_base_color = \#ffb0cb33
preview_base_border = \#ffb0cbcc

[resize]
activate = <super> BTN_RIGHT

[place]
mode = center

# Grid snapping ("desktop mode" for FLOATING windows; tiled windows are owned by
# simple-tile, so float them first with Super+T). Keypad + laptop alternatives:
#   halves   Super+Shift+Arrows         | Super+KP4/6/8/2
#   quarters Super+Shift+Y/I/N/M (TL/TR/BL/BR) | Super+KP7/9/1/3
#   center/maximize Super+Shift+C | Super+KP5   restore Super+Shift+Z | Super+KP0
[grid]
duration = 280ms circle
type = crossfade
slot_bl = <super> KEY_KP1 | <super> <shift> KEY_N
slot_b = <super> KEY_KP2 | <super> <shift> KEY_DOWN
slot_br = <super> KEY_KP3 | <super> <shift> KEY_M
slot_l = <super> KEY_KP4 | <super> <shift> KEY_LEFT
slot_c = <super> KEY_KP5 | <super> <shift> KEY_C
slot_r = <super> KEY_KP6 | <super> <shift> KEY_RIGHT
slot_tl = <super> KEY_KP7 | <super> <shift> KEY_Y
slot_t = <super> KEY_KP8 | <super> <shift> KEY_UP
slot_tr = <super> KEY_KP9 | <super> <shift> KEY_I
restore = <super> KEY_KP0 | <super> <shift> KEY_Z

# ── Effects ──────────────────────────────────────────────────────────────────
[blur]
method = kawase
blur_by_default = type is "toplevel"
kawase_offset = 2.0
kawase_degrade = 3
kawase_iterations = 3
saturation = 1.1

[wobbly]
friction = 14.0
spring_k = 32.0
grid_resolution = 8

[animate]
open_animation = zap
close_animation = fade
duration = 240ms circle
startup_duration = 400ms circle
zoom_duration = 240ms circle
fade_duration = 200ms circle
zap_duration = 240ms linear
enabled_for = type equals "toplevel" | (type equals "x-or" & focusable equals true)
zoom_enabled_for = none
fade_enabled_for = (type equals "overlay" | type equals "panel")
fire_enabled_for = none
minimize_animation = zoom
squeezimize_duration = 240ms circle

[alpha]
modifier = <alt> <super>
min_value = 0.2

# ── Workspaces ───────────────────────────────────────────────────────────────
[vswitch]
duration = 320ms sigmoid
gap = 0
wraparound = true
binding_left = <super> <ctrl> KEY_LEFT
binding_right = <super> <ctrl> KEY_RIGHT
binding_up = <super> <ctrl> KEY_UP
binding_down = <super> <ctrl> KEY_DOWN
binding_last = <super> KEY_BACKSPACE
with_win_left = <super> <ctrl> <shift> KEY_LEFT
with_win_right = <super> <ctrl> <shift> KEY_RIGHT
with_win_up = <super> <ctrl> <shift> KEY_UP
with_win_down = <super> <ctrl> <shift> KEY_DOWN
with_win_last = disabled
send_win_left = disabled
send_win_right = disabled
send_win_up = disabled
send_win_down = disabled
send_win_last = disabled
# themed: surface
background = \#191114ff

[expo]
toggle = <super> KEY_S
duration = 340ms sigmoid
offset = 110
inactive_brightness = 0.35
keyboard_interaction = true
# themed: surface
background = \#191114ff
transition_length = 240
select_workspace_1 = KEY_1
select_workspace_2 = KEY_2
select_workspace_3 = KEY_3
select_workspace_4 = KEY_4
select_workspace_5 = KEY_5
select_workspace_6 = KEY_6
select_workspace_7 = KEY_7
select_workspace_8 = KEY_8
select_workspace_9 = KEY_9

[scale]
toggle = <super> KEY_GRAVE
toggle_all = <super> <ctrl> KEY_TAB
duration = 300ms sigmoid
spacing = 30
outer_margin = 40
inactive_alpha = 0.6
middle_click_close = true
title_overlay = mouse
title_font_size = 14
title_position = center
# themed: surface_container / on_surface
bg_color = \#261d20e6
text_color = \#efdfe2ff
allow_zoom = true

[fast-switcher]
activate = disabled
activate_backward = disabled
inactive_alpha = 0.6

[focus-change]
left = disabled
right = disabled
up = disabled
down = disabled

# Window state: Super+F fullscreen, Super+M maximize, Super+Shift+P always on top,
# Super+Shift+O sticky (all workspaces), Super+Shift+H minimize, Super+Shift+D show desktop.
[wm-actions]
toggle_fullscreen = <super> KEY_F
toggle_maximize = <super> KEY_M
toggle_always_on_top = <super> <shift> KEY_P
toggle_sticky = <super> <shift> KEY_O
minimize = <super> <shift> KEY_H
toggle_showdesktop = <super> <shift> KEY_D
send_to_back = disabled
bring_to_front = disabled

[wayfire-shell]
toggle_menu = disabled

# DPMS disabled: screen-off while locked froze the session. Lock at 5m; suspend at 10m only on battery.
[idle]
toggle = disabled
screensaver_timeout = -1
dpms_timeout = -1
disable_on_fullscreen = true
disable_initially = false

# ── Window rules ─────────────────────────────────────────────────────────────
# Kitty uses its own background_opacity, so it is not dimmed again here.
# Floating windows are selected by [simple-tile] tile_by_default above.
[window-rules]
alpha_code = on created if app_id is "code" then set alpha 0.97
alpha_brave = on created if app_id is "brave-browser" then set alpha 0.97
alpha_dolphin = on created if app_id is "org.kde.dolphin" then set alpha 0.97
pip_on_top = on created if title is "Picture-in-Picture" then set always_on_top

# ── Keybindings ──────────────────────────────────────────────────────────────
[command]
# Apps
binding_terminal = <super> KEY_ENTER
command_terminal = kitty
binding_files = <super> KEY_E
command_files = ~/.local/bin/explore
binding_editor = <super> KEY_C
command_editor = code --ozone-platform-hint=wayland
binding_browser = <super> KEY_B
command_browser = brave
# Tap Super alone to open the application menu.
binding_launcher = <super> | <super> KEY_A | <super> <shift> KEY_ENTER
command_launcher = ~/.local/bin/desktop-menu
# App search keeps its own shortcut, separate from the visual menu.
binding_app_search = <super> <ctrl> KEY_ENTER
command_app_search = fuzzel
binding_monitor = <super> <shift> KEY_ESC
command_monitor = kitty -e btop
binding_display = <super> KEY_P | KEY_SWITCHVIDEOMODE
command_display = ~/.local/bin/display-mode
binding_widgets = <super> <alt> KEY_M
command_widgets = ~/.local/bin/widgetctl editor
binding_widgets_menu = <super> <alt> <shift> KEY_M
command_widgets_menu = ~/.local/bin/widgetctl editor palette
binding_widgets_toggle = <super> <alt> <ctrl> KEY_M
command_widgets_toggle = ~/.local/bin/widgetctl toggle-all

# Desktop
binding_lock = <super> <shift> KEY_L
command_lock = ~/.local/bin/lock
binding_clipboard = <super> KEY_V
command_clipboard = ~/.local/bin/clip-pick
# Global appearance selector
binding_desktop_style = <super> <alt> KEY_T
command_desktop_style = ~/.local/bin/desktop-style toggle
binding_wallpaper = <super> KEY_W
command_wallpaper = ~/.local/bin/raccon-float wallpaper
binding_wallpaper_quick = <super> <shift> KEY_W
command_wallpaper_quick = waypaper
binding_scheme = <super> <alt> KEY_W
command_scheme = ~/.local/bin/wallpaper-scheme
binding_notifications = <super> KEY_N
command_notifications = swaync-client -t -sw
binding_session = <super> KEY_L | <super> <ctrl> KEY_Q
command_session = ~/.local/bin/raccon-float session
binding_bar = <super> <ctrl> KEY_ESC
binding_bar_power = <super> <shift> KEY_B
command_bar_power = ~/.local/bin/waybar-toggle
command_bar = pkill -SIGUSR1 -x waybar

# Screenshots
binding_shot_area = <super> <shift> KEY_S
command_shot_area = ~/.local/bin/screenshot area
binding_shot_full = KEY_SYSRQ
command_shot_full = ~/.local/bin/screenshot full

# Media (single press)
binding_mute = KEY_MUTE
command_mute = swayosd-client --output-volume mute-toggle
binding_micmute = KEY_MICMUTE
command_micmute = swayosd-client --input-volume mute-toggle
binding_play = KEY_PLAYPAUSE
command_play = playerctl play-pause
binding_pause = KEY_PAUSECD
command_pause = playerctl play-pause
binding_next = KEY_NEXTSONG
command_next = playerctl next
binding_prev = KEY_PREVIOUSSONG
command_prev = playerctl previous

# Volume / brightness (repeat while held)
repeatable_binding_vol_up = KEY_VOLUMEUP
command_vol_up = swayosd-client --output-volume raise
repeatable_binding_vol_down = KEY_VOLUMEDOWN
command_vol_down = swayosd-client --output-volume lower
repeatable_binding_bright_up = KEY_BRIGHTNESSUP
command_bright_up = swayosd-client --brightness raise
repeatable_binding_bright_down = KEY_BRIGHTNESSDOWN
command_bright_down = swayosd-client --brightness lower

# Window navigation (wf-tile). Tiled | Floating:
#   Super+Arrows        focus neighbour (tiled and floating windows)
#   Super+Alt+Arrows    swap with neighbour | move window 60px (clamped to workarea)
#   Super+Ctrl+Alt+Arrows  resize split (repeat) | right/down grow, left/up shrink 60px
#   Super+J togglesplit, Super+Ctrl+T retile, Super+Shift+T tiling/floating mode,
#   Super+T float/tile focused window. Full list: ~/.config/wayfire-keys.md
binding_focus_left = <super> KEY_LEFT
command_focus_left = ~/.local/bin/wf-tile-ctl focus left
binding_swap_left = <super> <alt> KEY_LEFT
command_swap_left = ~/.local/bin/wf-tile-ctl swap left
repeatable_binding_resize_left = <super> <ctrl> <alt> KEY_LEFT
command_resize_left = ~/.local/bin/wf-tile-ctl resize left
binding_focus_right = <super> KEY_RIGHT
command_focus_right = ~/.local/bin/wf-tile-ctl focus right
binding_swap_right = <super> <alt> KEY_RIGHT
command_swap_right = ~/.local/bin/wf-tile-ctl swap right
repeatable_binding_resize_right = <super> <ctrl> <alt> KEY_RIGHT
command_resize_right = ~/.local/bin/wf-tile-ctl resize right
binding_focus_up = <super> KEY_UP
command_focus_up = ~/.local/bin/wf-tile-ctl focus up
binding_swap_up = <super> <alt> KEY_UP
command_swap_up = ~/.local/bin/wf-tile-ctl swap up
repeatable_binding_resize_up = <super> <ctrl> <alt> KEY_UP
command_resize_up = ~/.local/bin/wf-tile-ctl resize up
binding_focus_down = <super> KEY_DOWN
command_focus_down = ~/.local/bin/wf-tile-ctl focus down
binding_swap_down = <super> <alt> KEY_DOWN
command_swap_down = ~/.local/bin/wf-tile-ctl swap down
repeatable_binding_resize_down = <super> <ctrl> <alt> KEY_DOWN
command_resize_down = ~/.local/bin/wf-tile-ctl resize down
binding_window_tile = <super> KEY_T
command_window_tile = ~/.local/bin/wf-tile-ctl toggle
binding_dwindle = <super> <ctrl> KEY_J
command_dwindle = ~/.local/bin/wf-tile-ctl arrange
binding_togglesplit = <super> KEY_J
binding_retile = <super> <ctrl> KEY_T
binding_tilemode = <super> <shift> KEY_T
command_tilemode = ~/.local/bin/wf-tile-ctl mode toggle
command_retile = ~/.local/bin/wf-tile-ctl retile
command_togglesplit = ~/.local/bin/wf-tile-ctl togglesplit
# Resident tiling controls. Modes capture arrows; Enter/Escape finish.
binding_tile_preselect = <super> KEY_I
command_tile_preselect = ~/.local/bin/wf-tile-ctl preselect-mode
binding_tile_move = <super> KEY_D
command_tile_move = ~/.local/bin/wf-tile-ctl move-mode
binding_tile_resize = <super> KEY_R
command_tile_resize = ~/.local/bin/wf-tile-ctl resize-mode
binding_tile_cancel = <super> KEY_ESC
command_tile_cancel = ~/.local/bin/wf-tile-ctl cancel
binding_tile_undo = <super> <ctrl> KEY_Z
command_tile_undo = ~/.local/bin/wf-tile-ctl undo
binding_tile_redo = <super> <ctrl> <shift> KEY_Z
command_tile_redo = ~/.local/bin/wf-tile-ctl redo
binding_tile_save = <super> <ctrl> KEY_S
command_tile_save = ~/.local/bin/wf-tile-ctl favorite save
binding_tile_load = <super> <ctrl> KEY_L
command_tile_load = ~/.local/bin/wf-tile-ctl favorite load
binding_tile_ratio = <super> KEY_G
command_tile_ratio = ~/.local/bin/wf-tile-ctl ratio
binding_tile_gaps = <super> <ctrl> KEY_G
command_tile_gaps = ~/.local/bin/wf-tile-ctl gaps toggle
binding_scratch_1_toggle = <super> KEY_F6 | <super> KEY_U
command_scratch_1_toggle = ~/.local/bin/wf-tile-ctl scratch toggle 1
binding_scratch_1_assign = <super> <shift> KEY_F6 | <super> <shift> KEY_U
command_scratch_1_assign = ~/.local/bin/wf-tile-ctl scratch assign 1
binding_scratch_1_release = <super> <ctrl> KEY_F6 | <super> <ctrl> KEY_U
command_scratch_1_release = ~/.local/bin/wf-tile-ctl scratch release 1
binding_scratch_2_toggle = <super> KEY_F7
command_scratch_2_toggle = ~/.local/bin/wf-tile-ctl scratch toggle 2
binding_scratch_2_assign = <super> <shift> KEY_F7
command_scratch_2_assign = ~/.local/bin/wf-tile-ctl scratch assign 2
binding_scratch_2_release = <super> <ctrl> KEY_F7
command_scratch_2_release = ~/.local/bin/wf-tile-ctl scratch release 2
binding_scratch_3_toggle = <super> KEY_F8
command_scratch_3_toggle = ~/.local/bin/wf-tile-ctl scratch toggle 3
binding_scratch_3_assign = <super> <shift> KEY_F8
command_scratch_3_assign = ~/.local/bin/wf-tile-ctl scratch assign 3
binding_scratch_3_release = <super> <ctrl> KEY_F8
command_scratch_3_release = ~/.local/bin/wf-tile-ctl scratch release 3
binding_ws1 = <super> KEY_1
command_ws1 = ~/.local/bin/wf-ws goto 1
binding_sendws1 = <super> <shift> KEY_1
command_sendws1 = ~/.local/bin/wf-ws send 1
binding_ws2 = <super> KEY_2
command_ws2 = ~/.local/bin/wf-ws goto 2
binding_sendws2 = <super> <shift> KEY_2
command_sendws2 = ~/.local/bin/wf-ws send 2
binding_ws3 = <super> KEY_3
command_ws3 = ~/.local/bin/wf-ws goto 3
binding_sendws3 = <super> <shift> KEY_3
command_sendws3 = ~/.local/bin/wf-ws send 3
binding_ws4 = <super> KEY_4
command_ws4 = ~/.local/bin/wf-ws goto 4
binding_sendws4 = <super> <shift> KEY_4
command_sendws4 = ~/.local/bin/wf-ws send 4
binding_ws5 = <super> KEY_5
command_ws5 = ~/.local/bin/wf-ws goto 5
binding_sendws5 = <super> <shift> KEY_5
command_sendws5 = ~/.local/bin/wf-ws send 5
binding_ws6 = <super> KEY_6
command_ws6 = ~/.local/bin/wf-ws goto 6
binding_sendws6 = <super> <shift> KEY_6
command_sendws6 = ~/.local/bin/wf-ws send 6
binding_ws7 = <super> KEY_7
command_ws7 = ~/.local/bin/wf-ws goto 7
binding_sendws7 = <super> <shift> KEY_7
command_sendws7 = ~/.local/bin/wf-ws send 7
binding_ws8 = <super> KEY_8
command_ws8 = ~/.local/bin/wf-ws goto 8
binding_sendws8 = <super> <shift> KEY_8
command_sendws8 = ~/.local/bin/wf-ws send 8
binding_ws9 = <super> KEY_9
command_ws9 = ~/.local/bin/wf-ws goto 9
binding_sendws9 = <super> <shift> KEY_9
command_sendws9 = ~/.local/bin/wf-ws send 9
binding_ws10 = <super> KEY_0
command_ws10 = ~/.local/bin/wf-ws goto 10
binding_sendws10 = <super> <shift> KEY_0
command_sendws10 = ~/.local/bin/wf-ws send 10

[autostart]
raccon_menu = ~/.local/bin/desktop-menu prepare
desktop_power = ~/.local/bin/desktop-power daemon
autostart_wf_shell = false
env = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DISPLAY WAYFIRE_SOCKET && systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DISPLAY WAYFIRE_SOCKET
polkit = ~/.local/bin/desktop-polkit
wallpaper_daemon = awww-daemon
wallpaper = sh -c 'sleep 0.5; if command -v waypaper >/dev/null; then waypaper --restore; else ~/.local/bin/wallpaper-restore; fi'
bar = ~/.config/waybar/launch.sh
workspaces_state = ~/.local/bin/wf-ws-watch
notifications = swaync
osd = swayosd-server
clip_text = wl-paste --type text --watch cliphist store
clip_image = wl-paste --type image --watch cliphist store
idle = swayidle -w timeout 300 "$HOME/.local/bin/idle-lock" timeout 600 "$HOME/.local/bin/idle-suspend" before-sleep "$HOME/.local/bin/lock" lock "$HOME/.local/bin/lock"
# outputs = kanshi   # replaced by display-mode (kanshi cannot mirror)
focus_fx = ~/.local/bin/wf-focus-fx
tiling = ~/.local/bin/wf-tile watch
widgets = ~/.local/bin/widgetctl start

[cube]
activate = <super> <ctrl> BTN_LEFT | <super> BTN_MIDDLE
rotate_left = disabled
rotate_right = disabled
initial_animation = 500ms sigmoid
zoom = 0.55
speed_zoom = 0.06
speed_spin_horiz = 0.03
speed_spin_vert = 0.025
light = true
deform = 1
background_mode = skydome
skydome_texture = @RDOT_HOME@/Pictures/Wallpapers/wallpaper.png
skydome_mirror = true

[switcher]
next_view = <alt> KEY_TAB
prev_view = <alt> <shift> KEY_TAB
speed = 420ms sigmoid
view_thumbnail_scale = 1.0
view_thumbnail_rotation = 30

[vswipe]
enable_horizontal = true
enable_vertical = true
enable_free_movement = false
enable_smooth_transition = true
fingers = 3
duration = 300ms sigmoid
gap = 0
background = \#00000000

[wsets]
label_duration = 1200ms

[winshadows]
enabled_views = type is "toplevel"
include_undecorated_views = false
shadow_color = \#00000000
shadow_radius = 1
glow_enabled = true
glow_color = \#ffb0cbcc
glow_intensity = 0.45
glow_spread = 14
glow_radius_limit = 70
glow_emissivity = 1.0
glow_threshold = 0.03

