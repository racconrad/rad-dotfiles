# Generated by matugen from @RDOT_HOME@/Pictures/Wallpapers/wallpaper.png — edit ~/.config/matugen/templates/starship.toml.
"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
palette = "matugen"

format = """
[](fg:primary_container)\
$directory\
[](fg:primary_container bg:surface_high)\
$git_branch\
$git_status\
[](fg:surface_high)\
$fill\
$cmd_duration\
$line_break\
$character"""

[palettes.matugen]
primary = "#ffb0cb"
on_primary = "#541d35"
primary_container = "#6f334b"
on_primary_container = "#ffd9e4"
secondary = "#e2bdc8"
tertiary = "#f0bc95"
error = "#ffb4ab"
surface_high = "#31282a"
on_surface = "#efdfe2"
muted = "#d5c2c6"
outline = "#9d8c91"

[directory]
format = "[ $path ]($style)[$read_only]($read_only_style)"
style = "bold fg:on_primary_container bg:primary_container"
read_only = " 󰌾"
read_only_style = "bold fg:on_primary_container bg:primary_container"
truncation_length = 3
truncation_symbol = "…/"
home_symbol = "~"

[git_branch]
format = "[ $symbol$branch ]($style)"
symbol = " "
style = "bold fg:tertiary bg:surface_high"

[git_status]
format = "[($all_status$ahead_behind )]($style)"
style = "bold fg:secondary bg:surface_high"

[fill]
symbol = " "
style = "fg:on_surface"

[cmd_duration]
min_time = 2000
format = "[󱎫 $duration]($style)"
style = "bold fg:secondary"

[character]
success_symbol = "[❯](bold fg:primary)"
error_symbol = "[❯](bold fg:error)"
vimcmd_symbol = "[❮](bold fg:tertiary)"
