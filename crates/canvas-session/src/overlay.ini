[window-rules]
alpha_code = on created if app_id is "code" then set alpha 1
alpha_brave = on created if app_id is "brave-browser" then set alpha 1
alpha_dolphin = on created if app_id is "org.kde.dolphin" then set alpha 1

[orbit]
toggle = disabled

[expo]
toggle = disabled

[vswitch]
with_win_left = disabled
with_win_right = disabled
with_win_up = disabled
with_win_down = disabled

[scale]
toggle_all = disabled

[vswipe]
enable_horizontal = false

[wm-actions]
toggle_sticky = disabled
toggle_showdesktop = disabled

[animate]
open_animation = none
close_animation = zoom
duration = 220ms sigmoid
zoom_duration = 220ms sigmoid
